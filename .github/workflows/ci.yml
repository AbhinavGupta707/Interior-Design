name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_NO_PROGRESS: "1"

jobs:
  javascript:
    name: JavaScript quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TURBO_CONCURRENCY: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: false
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          check-latest: false
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: "0.11.16"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(pnpm --version)" = "10.33.0"
          test "$(node -p 'require("./package.json").packageManager')" = "pnpm@10.33.0"

      - name: Install portable media test tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg poppler-utils

      - name: Install frozen dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen

      - name: Build workspace dependency declarations
        shell: bash
        run: pnpm build

      - name: Run formatting, lint, types, units, and builds
        shell: bash
        run: pnpm verify:js

  python:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          check-latest: false
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: "0.11.16"

      - name: Verify pinned Python toolchain
        shell: bash
        run: |
          test "$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "$(cat .python-version)"
          test "$(uv --version | cut -d " " -f 2)" = "0.11.16"

      - name: Install Python dependencies
        shell: bash
        run: uv sync --frozen

      - name: Run Python lint, types, and tests
        shell: bash
        run: uv run ruff check . && uv run mypy . && uv run pytest

  portable-gates:
    name: Portable contract and security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: false
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          check-latest: false
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: "0.11.16"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(pnpm --version)" = "10.33.0"
          test "$(uv --version | cut -d " " -f 2)" = "0.11.16"

      - name: Install portable media test tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg poppler-utils

      - name: Install frozen dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen

      - name: Run contract tests
        shell: bash
        run: pnpm test:contract

      - name: Run portable integration tests
        shell: bash
        run: pnpm test:integration

      - name: Run security tests
        shell: bash
        run: pnpm test:security

      - name: Run geometry tests
        shell: bash
        run: pnpm test:geometry

      - name: Run API composition checks
        shell: bash
        run: pnpm api:check

      - name: Run dependency-boundary checks
        shell: bash
        run: pnpm dependency:boundaries

  bootstrap:
    name: Bootstrap contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: false
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          check-latest: false
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: "0.11.16"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Audit prerequisites
        shell: bash
        run: python tests/bootstrap/check_prerequisites.py

      - name: Prove frozen installation
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen

      - name: Validate bootstrap and infrastructure contracts
        shell: bash
        run: uv run python tests/bootstrap/test_configuration.py
